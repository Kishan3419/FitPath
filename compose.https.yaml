# Run together with compose.yaml: docker compose -f compose.yaml -f compose.https.yaml up -d --build
# Caddy uses host networking on Linux so it can proxy to 127.0.0.1:3000.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      FITPATH_DOMAIN: ${FITPATH_DOMAIN:?Set FITPATH_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 160m
    pids_limit: 64
    depends_on:
      - fitpath
volumes:
  caddy_data:
  caddy_config:
